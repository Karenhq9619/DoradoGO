                aiPicks = picks;
                typeInto(aiTextElem, String(r.message), instant);
                document.getElementById('ai-source').textContent = t.aiSrcAI;
            } catch (e) {
                aiBusy = false; aiPicks = {}; legacyAnalysis(instant); return;
            }
            aiBusy = false;
            renderRecommendations();
        }

        function renderRecommendations() {
            const grid = document.getElementById('recommendations-grid');
            let items = [...data[currentLang].items];

            if (activeInterestFilter) {
                items = items.filter(item => item.categoryKey === activeInterestFilter || aiPicks[item.id] !== undefined);
            }

            if (activeTimeFilter) {
                items = items.filter(item => item.allowedTimes.includes(activeTimeFilter));
            }

            if (currentCategory !== 'all') {
                items = items.filter(item => item.type === currentCategory);
            }

            items.sort((a, b) => (aiPicks[b.id] !== undefined ? 1 : 0) - (aiPicks[a.id] !== undefined ? 1 : 0));

            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center py-8 text-slate-400 text-sm">No hay resultados directos para esta combinación en este momento.</div>`;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 hover:shadow-md transition flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="bg-blue-50 text-blue-700 text-xs font-semibold px-2.5 py-0.5 rounded-md">${item.badge}</span>
                            <span class="text-xs text-slate-500 font-medium"><svg class="mr-1" style="width:1em;height:1em;display:inline-block;vertical-align:-0.125em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${item.time}</span>
                        </div>
                        <h4 class="font-bold text-slate-900 text-base mb-1">${item.title}</h4>
                        <p class="text-xs text-slate-500 leading-relaxed mb-3">${item.desc}</p>
                        ${aiPicks[item.id] !== undefined ? `<div class="mb-3 text-xs bg-blue-50 text-blue-900 border border-blue-100 rounded-lg p-2.5"><span class="font-bold">${data[currentLang].aiWhy}</span> ${escapeHtml(aiPicks[item.id])}</div>` : ''}
                        
                        <!-- Calificación por Estrellas -->
                        <div class="flex items-center space-x-1.5 text-xs text-amber-500 font-bold mb-2">
                            <svg class="" style="width:1em;height:1em;display:inline-block;vertical-align:-0.125em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26" fill="currentColor"/></svg>
                            <span class="text-slate-800">${item.rating}</span>
                            <span class="text-slate-400 font-normal">${item.reviews}</span>
                        </div>
                    </div>
                    <button onclick="openDetails(${item.id})" class="mt-2 w-full bg-slate-100 hover:bg-slate-900 hover:text-white text-slate-800 text-xs font-semibold py-2.5 rounded-xl transition">
                        ${currentLang === 'es' ? 'Ver detalles / Ruta' : 'View details / Route'}
                    </button>
                </div>
            `).join('');
        }

        function openDetails(itemId) {
            const item = data[currentLang].items.find(i => i.id === itemId);
            const labels = data[currentLang].detailsLabels;
            const modalContent = document.getElementById('modal-content');
            currentDetailItem = item;

            const opinionsHTML = item.opinions.map(op => `
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 space-y-1">
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold text-slate-800">${op.user}</span>
                        <div class="text-amber-500">
                            ${'<svg class="" style="width:1em;height:1em;display:inline-block;vertical-align:-0.125em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26" fill="currentColor"/></svg>'.repeat(op.stars)}
                        </div>
                    </div>
                    <p class="text-xs text-slate-600 italic">"${op.comment}"</p>
                </div>
            `).join('');

            modalContent.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-1 rounded-md">${item.badge}</span>
                        <h3 class="text-xl font-bold text-slate-900 mt-1">${item.title}</h3>
                        
                        <!-- Calificación visible en el modal -->
                        <div class="flex items-center space-x-2 text-xs text-amber-500 font-bold mt-2">
                            <div class="flex items-center space-x-1">
                                <svg class="" style="width:1em;height:1em;display:inline-block;vertical-align:-0.125em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26" fill="currentColor"/></svg>
                                <span class="text-slate-800 text-sm">${item.rating}</span>
                            </div>
                            <span class="text-slate-400 font-normal">(${item.reviews} ${currentLang === 'es' ? 'reseñas de viajeros' : 'traveler reviews'})</span>
                        </div>
                    </div>

                    <p class="text-sm text-slate-600 leading-relaxed">${item.detailedDesc}</p>
                    
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2 text-xs">
                        <div class="flex justify-between">
                            <span class="font-semibold text-slate-500">${labels.price}</span>
                            <span class="font-bold text-slate-800">${item.price}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="font-semibold text-slate-500">${labels.distance}</span>
                            <span class="font-bold text-slate-800">${item.distance}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="font-semibold text-slate-500">${labels.time}</span>
                            <span class="font-bold text-slate-800">${item.time}</span>
                        </div>
                        <div class="flex justify-between border-t border-slate-200 pt-2 mt-2">
                            <span class="font-semibold text-slate-500">${labels.hours}</span>
                            <span class="font-bold text-slate-800 text-right">${item.hours}</span>
                        </div>
                    </div>

                    <!-- Sección de Opiniones / Reviews -->
                    <div class="space-y-2">
                        <h4 class="font-bold text-slate-900 text-xs uppercase tracking-wider">${labels.reviewsTitle}</h4>
                        <div class="space-y-2">
                            ${opinionsHTML}
                        </div>
                    </div>

                    <!-- Generador de QR Realista -->
                    <div id="qr-container" class="hidden flex flex-col items-center justify-center p-4 bg-slate-900 rounded-2xl text-white space-y-2 relative overflow-hidden">
                        <div id="qr-box" class="w-32 h-32 bg-white p-2 rounded-xl flex items-center justify-center overflow-hidden"></div>
                        <p class="text-xs text-blue-400 font-medium">${currentLang === 'es' ? 'Escanea este código con tu celular' : 'Scan this code with your phone'}</p>
                    </div>

                    <button id="btn-qr-action" onclick="generateQRCode()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm py-3 rounded-xl transition shadow-lg shadow-blue-600/20 flex items-center justify-center space-x-2">
                        <svg class="" style="width:1em;height:1em;display:inline-block;vertical-align:-0.125em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/><rect x="3" y="16" width="5" height="5"/><path d="M21 16h-3a2 2 0 0 0-2 2v3M21 21v.01M12 7v3a2 2 0 0 1-2 2H7M3 12h.01M12 3h.01M12 16v.01M16 12h1M21 12v.01M12 21v-1"/></svg>
                        <span>${labels.btnRoute}</span>
                    </button>
                </div>
            `;

            document.getElementById('details-modal').classList.remove('hidden');
        }

        function generateQRCode() {
            const qrContainer = document.getElementById('qr-container');
            const btn = document.getElementById('btn-qr-action');
            const box = document.getElementById('qr-box');
            const dest = currentDetailItem.title.replace(/\(.*?\)/g, '').trim() + ', Bogotá, Colombia';
            const url = 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent('Aeropuerto Internacional El Dorado, Bogotá') + '&destination=' + encodeURIComponent(dest);
            try {
                const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
                box.innerHTML = qr.createSvgTag(4, 0);
                const sv = box.querySelector('svg');
                sv.removeAttribute('width'); sv.removeAttribute('height'); sv.style.width = '100%'; sv.style.height = '100%';
            } catch (e) {
                box.innerHTML = '<p class="text-xs text-slate-700 text-center">' + data[currentLang].qrFail + '</p>';
            }
            qrContainer.classList.remove('hidden');
            btn.innerHTML = `<svg class="text-emerald-400" style="width:1em;height:1em;display:inline-block;vertical-align:-0.125em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg> <span>${currentLang === 'es' ? '¡Código QR Generado con Éxito!' : 'QR Code Generated Successfully!'}</span>`;
            btn.className = "w-full bg-emerald-600 text-white font-bold text-sm py-3 rounded-xl transition flex items-center justify-center space-x-2 cursor-default";
        }

        function closeDetails() {
            document.getElementById('details-modal').classList.add('hidden');
        }

        function resetApp() {
            aiPicks = {};
            document.getElementById('ask-text').value = '';
            document.getElementById('select-time').selectedIndex = 0;
            document.getElementById('select-interest').selectedIndex = 0;
            activeInterestFilter = null;
            activeTimeFilter = null;
            document.getElementById('ai-response-box').classList.add('hidden');
            document.getElementById('catalog-container').classList.add('hidden');
            switchCategory('all');
        }

        // Inicializar opciones de select al cargar la página
        initSelectOptions();
    </script>
</body>
</html>
